name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check formatting
        run: npm run format:check

      - name: Write build revision
        run: printf '%s\n' "$GITHUB_SHA" > dist/version.txt

      - name: Build and verify Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --tag "portfolio:$IMAGE_TAG" .
          docker run --detach --name portfolio-ci --read-only \
            --tmpfs /tmp:size=16m,noexec,nosuid,nodev --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 64m --pids-limit 64 \
            --publish 127.0.0.1:54321:8080 "portfolio:$IMAGE_TAG"
          trap 'docker rm -f portfolio-ci' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:54321/healthz; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://127.0.0.1:54321

      - name: Configure SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/portfolio_deploy"
          chmod 0600 "$HOME/.ssh/portfolio_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Build and stream image to VPS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          docker save "portfolio:$IMAGE_TAG" | gzip -1 | ssh -T \
            -i "$HOME/.ssh/portfolio_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "deploy $IMAGE_TAG"
