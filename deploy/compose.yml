services:
  web:
    image: ${IMAGE:?Set IMAGE to a portfolio image tag}
    container_name: portfolio
    restart: unless-stopped
    ports:
      - '127.0.0.1:8089:8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:8080/healthz | grep -qx ok',
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
