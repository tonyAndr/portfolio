server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    expires -1;

    location /_astro/ {
        expires 1y;
        try_files $uri =404;
    }

    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /es {
        return 308 /es/$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~ /\. {
        deny all;
    }
}
